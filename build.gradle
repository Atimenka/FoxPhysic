// FoxPhys 0.1.1-beta-release multi-loader build. Loader-specific code lives in :fabric and :neoforge;
// Java/protocol/ABI code shared without Minecraft mappings lives in :common.
allprojects {
    group = providers.gradleProperty('maven_group').get()
    version = providers.gradleProperty('mod_version').get()
}

def loaderBuilds = [':fabric:build', ':neoforge:build']

tasks.register('compileJava') {
    group = 'build'
    description = 'Compiles the shared, Fabric, and NeoForge Java source sets.'
    dependsOn ':common:compileJava', ':fabric:compileJava', ':neoforge:compileJava'
}

tasks.register('check') {
    group = 'verification'
    description = 'Runs common/Fabric tests and compiles the NeoForge source set.'
    dependsOn ':common:check', ':fabric:check', ':neoforge:compileJava'
}

tasks.register('build') {
    group = 'build'
    description = 'Builds distributable Fabric and NeoForge 0.1.1-beta-release jars.'
    dependsOn loaderBuilds
}

tasks.register('clean') {
    group = 'build'
    description = 'Cleans Gradle outputs for all three modules.'
    dependsOn ':common:clean', ':fabric:clean', ':neoforge:clean'
}

defaultTasks 'build'
