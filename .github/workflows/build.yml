name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - uses: gradle/actions/setup-gradle@v4
      - name: Rust tests
        working-directory: native
        run: cargo test --locked
      - name: Rust lint
        working-directory: native
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build Fabric and NeoForge jars
        run: ./gradlew build --no-daemon --max-workers=1
        if: runner.os != 'Windows'
      - name: Build Fabric and NeoForge jars
        run: ./gradlew.bat build --no-daemon --max-workers=1
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: foxphys-${{ runner.os }}-x64
          path: |
            fabric/build/libs/foxphys-fabric-0.1.1-beta-release*.jar
            neoforge/build/libs/foxphys-neoforge-0.1.1-beta-release*.jar
          if-no-files-found: error
